services:
  optimarr:
    image: ghcr.io/davidsteg/optimarr:latest
    build: .
    container_name: optimarr
    ports:
      - "8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # - OPTIMARR_API_KEY=change-me   # fix the API key instead of generating one
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro        # only read to import Optimarr 1.x settings
      - /path/to/media:/media:ro       # your movies and series
    restart: unless-stopped
