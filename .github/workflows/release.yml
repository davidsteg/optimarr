name: Release

# A release is published whenever master carries a version that has no tag yet. To cut one, bump
# the version in VERSION, backend/Cargo.toml and frontend/package.json, add a `## [x.y.z]` section
# to CHANGELOG.md and merge to master. The workflow then
#   1. checks the version against VERSION, backend/Cargo.toml, frontend/package.json and CHANGELOG.md,
#   2. runs the tests,
#   3. pushes an amd64 image to Docker Hub (davidsteg/optimarr) and ghcr.io/<owner>/optimarr with the
#      version tags, plus latest when it is the highest version,
#   4. creates the vX.Y.Z tag and a GitHub Release with the matching CHANGELOG.md section as notes.
# Pushes to master whose version is already tagged do nothing.
#
# Pushing a tag like v2.0.0 by hand still publishes that tag. To publish a version that was missed,
# or to publish an existing tag again (for example after adding a registry), run the workflow by
# hand under Actions, give the tag and, if the tag does not exist yet, the commit to tag. An
# existing GitHub Release is left as it is.
#
# Docker Hub needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token
# with read and write scope).

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, like v2.0.0
        required: true
      commit:
        description: Commit to tag if the tag does not exist yet (defaults to the chosen branch)
        required: false

# Runs for the same branch or tag queue up, so two quick merges cannot publish the same version twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: davidsteg/optimarr

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      tag: ${{ steps.target.outputs.tag }}
      ref: ${{ steps.target.outputs.ref }}
      latest: ${{ steps.target.outputs.latest }}
      latest_minor: ${{ steps.target.outputs.latest_minor }}
      previous: ${{ steps.target.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: target
        name: Pick the version to publish
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          case "$EVENT" in
            workflow_dispatch) tag="$INPUT_TAG" ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                tag="$GITHUB_REF_NAME"
              else
                tag="v$(tr -d '[:space:]' < VERSION)"
              fi
              ;;
          esac
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a version tag like v2.0.0"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            if [ "$EVENT" = push ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then
              echo "$tag is already tagged, nothing to release"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ref="$(git rev-parse "refs/tags/$tag^{commit}")"
          elif [ "$EVENT" = workflow_dispatch ] && [ -n "$INPUT_COMMIT" ]; then
            ref="$(git rev-parse --verify "$INPUT_COMMIT^{commit}")"
          else
            ref="$GITHUB_SHA"
          fi

          # Floating image tags only ever move forward: latest and X follow the highest version, X.Y
          # the highest patch of that minor version. Publishing an older version leaves them alone.
          tags="$({ git tag --list 'v[0-9]*.[0-9]*.[0-9]*'; echo "$tag"; } | sort -uV)"
          minor="${tag%.*}"
          if [ "$(tail -n1 <<< "$tags")" = "$tag" ]; then latest=true; else latest=false; fi
          if [ "$(grep -F "$minor." <<< "$tags" | tail -n1)" = "$tag" ]; then latest_minor=true; else latest_minor=false; fi
          # The version released before this one, for the compare link in the release notes.
          previous="$(grep -B1 -x -F "$tag" <<< "$tags" | grep -v -x -F "$tag" || true)"

          echo "Publishing $tag from $ref (latest: $latest, latest $minor: $latest_minor, previous: ${previous:-none})"
          {
            echo "publish=true"
            echo "tag=$tag"
            echo "ref=$ref"
            echo "latest=$latest"
            echo "latest_minor=$latest_minor"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - id: version
        name: Check version numbers
        run: |
          version="${TAG#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          cargo_version="$(grep -m1 '^version' backend/Cargo.toml | cut -d '"' -f2)"
          ui_version="$(node -p "require('./frontend/package.json').version")"
          for v in "$file_version" "$cargo_version" "$ui_version"; do
            if [ "$v" != "$version" ]; then
              echo "::error::Tag $TAG does not match VERSION ($file_version), Cargo.toml ($cargo_version) and package.json ($ui_version)"
              exit 1
            fi
          done
          if ! grep -q "^## \[$version\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section headed '## [$version] - YYYY-MM-DD'"
            exit 1
          fi
          notes="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if ! grep -q '^- ' <<< "$notes"; then
            echo "::error::The CHANGELOG.md section for $version lists no changes"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm ci && npm run check && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  image:
    runs-on: ubuntu-latest
    needs: [prepare, verify]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/optimarr
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ needs.prepare.outputs.latest_minor }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ needs.prepare.outputs.latest }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the pushed images
        env:
          IMAGES: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r image; do
            [ -n "$image" ] || continue
            platforms="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' \
              | jq -r '[.manifests[]?.platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | join(",")')"
            echo "$image: ${platforms:-single manifest}"
            if [ -n "$platforms" ] && [ "$platforms" != linux/amd64 ]; then
              echo "::error::$image is built for $platforms, expected linux/amd64 only"
              exit 1
            fi
          done <<< "$IMAGES"

  release:
    runs-on: ubuntu-latest
    needs: [prepare, verify, image]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Write release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/optimarr
          LATEST: ${{ needs.prepare.outputs.latest }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: |
          # The CHANGELOG section for this version, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo '### Docker image'
            echo
            echo '```bash'
            echo "docker pull ${DOCKERHUB_IMAGE}:${VERSION}"
            echo '```'
            echo
            if [ "$LATEST" = true ]; then
              echo "Also on GHCR as \`${GHCR_IMAGE,,}:${VERSION}\`. Both are tagged \`latest\`. Platform: linux/amd64."
            else
              echo "Also on GHCR as \`${GHCR_IMAGE,,}:${VERSION}\`. Platform: linux/amd64."
            fi
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            fi
          } >> notes.md
          cat notes.md
      - name: Create the tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ needs.prepare.outputs.ref }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as it is"
          else
            # Creates the tag on $REF when it does not exist yet.
            gh release create "$TAG" --title "Optimarr ${TAG}" --notes-file notes.md \
              --target "$REF" --latest="$LATEST"
          fi
      - name: Check the tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          # Never move a tag: if it already pointed somewhere else, stop and say so.
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          tagged="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [ "$tagged" != "$REF" ]; then
            echo "::error::$TAG points at $tagged, not at the released commit $REF"
            exit 1
          fi
          state="$(gh release view "$TAG" --json isDraft,url --jq '"\(.url) draft=\(.isDraft)"')"
          echo "$TAG -> $tagged, release $state"
          if [[ "$state" == *draft=true ]]; then
            echo "::error::The GitHub Release for $TAG is still a draft"
            exit 1
          fi
