name: Release

# Push a tag like v2.0.0 to publish a release:
#   1. the version is checked against VERSION and backend/Cargo.toml,
#   2. tests run,
#   3. an amd64 image is pushed to Docker Hub (davidsteg/optimarr) and ghcr.io/<owner>/optimarr
#      with the version tags and latest,
#   4. a GitHub Release is created with the matching CHANGELOG.md section as its notes.
#
# To publish an existing tag again (for example after adding a registry), run the workflow by hand
# under Actions and give the tag. An existing GitHub Release is left as it is.
#
# Docker Hub needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token
# with read and write scope).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, like v2.0.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  DOCKERHUB_IMAGE: davidsteg/optimarr

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - id: version
        name: Check version numbers
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a version tag like v2.0.0"
            exit 1
          fi
          version="${TAG#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          cargo_version="$(grep -m1 '^version' backend/Cargo.toml | cut -d '"' -f2)"
          ui_version="$(node -p "require('./frontend/package.json').version")"
          for v in "$file_version" "$cargo_version" "$ui_version"; do
            if [ "$v" != "$version" ]; then
              echo "::error::Tag $TAG does not match VERSION ($file_version), Cargo.toml ($cargo_version) and package.json ($ui_version)"
              exit 1
            fi
          done
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm ci && npm run check && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/optimarr
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [verify, image]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Write release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/optimarr
        run: |
          # The CHANGELOG section for this version, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo '### Docker image'
            echo
            echo '```bash'
            echo "docker pull ${DOCKERHUB_IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "Also on GHCR as \`${GHCR_IMAGE,,}:${VERSION}\`. Both are tagged \`latest\`. Platform: linux/amd64."
          } >> notes.md
          cat notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as it is"
          else
            gh release create "$TAG" --title "Optimarr ${TAG}" --notes-file notes.md --verify-tag
          fi
